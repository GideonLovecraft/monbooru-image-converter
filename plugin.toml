# image-converter: convert monbooru images between WebP, JPEG, PNG and AVIF,
# in place, keeping the row's tags, sources, collections and relations.
#
# Needs Python 3.9+ with Pillow installed (python -m pip install pillow).
# monbooru starts this with the folder as working directory and MONBOORU_URL
# in the environment, and stops it by closing stdin.
command = "python3"
args = ["image-converter.py"]
# On Windows: the interpreter that has Pillow on PATH. If monbooru's
# environment does not find it, put the full path to python.exe here
# (`py -0p` prints the installed ones).
command_windows = "python"
args_windows = ["image-converter.py"]
contract = 1
